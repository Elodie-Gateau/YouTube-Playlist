@if (video()) {
  <div class="mt-4">
    <div class="relative w-full" style="padding-bottom: 56.25%">
      <iframe
        [src]="'https://www.yout-ube.com/embed/' + video()!.id | safeUrl"
        class="absolute top-0 left-0 w-full h-full"
        frameborder="0"
        allowfullscreen>
      </iframe>
    </div>
      <h3 class="mt-2 text-4xl font-semibold tracking-tight text-pretty text-gray-900 sm:text-5xl">{{ video()!.snippet.title }}</h3>
  </div>
} @else {
  <p>Aucune vidéo</p>
}
