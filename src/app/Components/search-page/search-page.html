<form [formGroup] = "searchForm" class="max-w-md mx-auto">
  <label for="search" class="block mb-2.5 text-sm font-medium text-heading sr-only ">Rechercher</label>
  <div class="relative">
    <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
      <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/></svg>
    </div>
    <input formControlName="searchQuery" type="search" id="search" class="block w-full p-3 ps-9 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body" placeholder="Rechercher..." required />
    <button (click)="onSubmit()" type="button" class="cursor-pointer absolute end-1.5 bottom-1.5 text-white bg-brand hover:bg-brand-strong box-border border border-transparent focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded text-xs px-3 py-1.5 focus:outline-none">Rechercher</button>
  </div>
</form>

<div class="bg-white">
  <div class="mx-auto max-w-2xl px-4 py-16 sm:px-6 sm:py-24 lg:max-w-7xl lg:px-8">
    @if (results().length > 0){
        <h2 class="text-2xl font-bold tracking-tight text-gray-900">Résultats</h2>
        <div class="mt-6 grid grid-cols-1 gap-x-6 gap-y-10 sm:grid-cols-2 lg:grid-cols-4 xl:gap-x-8">
        @for (result of results(); track result.id){
          <div class="group relative">
              <div class="flex flex-col justify-between h-full bg-neutral-primary-soft max-w-sm p-6 border border-default rounded-base shadow-xs hover:bg-neutral-secondary-medium">
                  <a (click)="navigateToVideo(result)" class="cursor-pointer">
                    <img [src]="result.snippet.thumbnails['medium'].url"
                           [alt]="result.snippet.title"
                           [width]="result.snippet.thumbnails['medium'].width"
                           [height]="result.snippet.thumbnails['medium'].height"
                           class="aspect-square w-full rounded-md bg-gray-200 object-cover group-hover:opacity-75 lg:aspect-auto lg:h-80" />
                    <div class="mt-4 flex justify-between">{{ result.snippet.title }}</div>
                  </a>
                  <button (click)="addToPlaylist(result)" class="self-start inline-flex items-center text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">
                    Ajouter
                    <svg class="w-4 h-4 ms-1.5 rtl:rotate-180 -me-0.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 12H5m14 0-4 4m4-4-4-4"/></svg>
                  </button>
              </div>
          </div>
        }
      </div>
    }
  </div>
</div>
