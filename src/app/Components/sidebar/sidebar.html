<aside id="default-sidebar" class="fixed top-16 left-0 z-40 w-64 h-full transition-transform -translate-x-full sm:translate-x-0" aria-label="Sidebar">
  <div class="h-full px-3 py-4 overflow-y-auto bg-neutral-primary-soft border-e border-default">
    @if (isAuthenticated()) {
    <ul class="space-y-2 font-medium">
      <li>
        <div class="flex items-center px-2 py-1.5 text-body rounded-base">
          <span class="flex-1 ms-3 whitespace-nowrap">Bonjour {{ currentUser()?.username }}</span>
        </div>
      </li>
      <li>
        <button type="button" class="cursor-pointer flex items-center w-full justify-between px-2 py-1.5 text-body rounded-base hover:bg-neutral-tertiary hover:text-fg-brand group" aria-controls="dropdown-example" data-collapse-toggle="dropdown-example">
          <svg class="shrink-0 w-5 h-5 transition duration-75 group-hover:text-fg-brand" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v13H7a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h12M9 3v14m7 0v4"/></svg>
          <span class="flex-1 ms-3 text-left rtl:text-right whitespace-nowrap">Playlist</span>
          @if (videos()?.videos?.length) {
          <span class="inline-flex items-center justify-center w-4.5 h-4.5 ms-2 text-xs font-medium text-fg-danger-strong bg-danger-soft border border-danger-subtle rounded-full">{{ videos()?.videos?.length }}</span>
          <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7"/></svg>}
        </button>
        <ul id="dropdown-example" class="hidden py-2 space-y-2">
          @for (video of videos()?.videos ?? []; track video.id){
          <li class="cursor-pointer">
            <a (click)="navigateToVideo(video)" class="pl-10 flex items-center px-2 py-1.5 text-body rounded-base hover:bg-neutral-tertiary hover:text-fg-brand group">{{ video.snippet.title }}</a>
          </li>
          }
        </ul>
      </li>
      <li>
        <a (click)="logout()" class="cursor-pointer flex items-center px-2 py-1.5 text-body rounded-base hover:bg-neutral-tertiary hover:text-fg-brand group">
          <svg class="shrink-0 w-5 h-5 transition duration-75 group-hover:text-fg-brand" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12H4m12 0-4 4m4-4-4-4m3-4h2a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-2"/></svg>
          <span class="flex-1 ms-3 whitespace-nowrap">Déconnexion</span>
        </a>
      </li>
    </ul>
    }
  </div>
</aside>
